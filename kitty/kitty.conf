# kitty — main config.
#
# SELF-CONTAINED BY DESIGN. Nothing in this tree reads from ~/.config/ghostty,
# and nothing in Ghostty's tree reads from here. The two terminals were
# separated on 2026-08-07 because Ghostty's theme machinery (switcher,
# completions, welcome art) was firing inside kitty via ~/.zshrc, so kitty
# inherited Ghostty's furniture while running on kitty's stock colours.
#
# The split has three surfaces; all three must stay separate:
#   1. this directory              — kitty's config, themes, state
#   2. ~/.zshrc $TERM_HOST gate    — per-terminal shell furniture
#   3. ~/.config/ghostty           — untouched, still Ghostty's own
#
# Load order: kitty reads top to bottom, last write wins, so
# current-theme.conf is included LAST and overrides everything above it.
# Reload without restarting: ctrl+cmd+, — no relaunch needed.
# (listen_on and allow_remote_control need a full restart, everything else
# reloads live.)

# ──────────────────────────────────────────────────────────────────────────
# Font
# ──────────────────────────────────────────────────────────────────────────
# The Nerd Font is functional, not decorative: `eza --icons` and starship both
# emit private-use-area glyphs that Menlo (kitty's macOS default) has no
# coverage for, so without this the prompt and file listings render tofu.
# Installed at ~/Library/Fonts/JetBrainsMonoNerdFontMono-*.ttf.
#
# The MONO variant on purpose. The plain "JetBrainsMono Nerd Font" family
# fails kitty's CoreText monospace check (its icon glyphs have uneven
# advances), and kitty then falls back to Menlo with only a one-line
# startup warning — measured on 2026-08-07 with kitty 0.46.2:
#   get_font_files() -> Menlo-Regular for the old name,
#   JetBrainsMonoNFM-Regular for this one.
font_family      JetBrainsMono Nerd Font Mono
font_size        14.0

# Ligatures on (JetBrains Mono's ->, =>, !=). kitty enables them by default;
# stated explicitly so the intent is visible when the theme layer lands.
disable_ligatures never

# text_composition_strategy is left at its default (platform): on macOS that
# reproduces the system's slightly-heavier glyph dilation, which is the right
# weight for hours of light-on-dark TUI text. Only touch it if glyphs ever
# look anaemic after an OS update.

# ──────────────────────────────────────────────────────────────────────────
# Keys — everything lives on cmd / cmd+shift, so the shell and Claude Code
# keep every plain ctrl/alt chord (ctrl+r atuin, ctrl+t / alt+c fzf, ctrl+l
# clear widget, ctrl+c, ctrl+d). kitty maps fire BEFORE the running app sees
# the key, so a ctrl binding here would shadow the program underneath.
#
# cmd+/ pops the cheatsheet. It is rendered live from THIS file by
# ./kitty-keys: `#|= NAME` lines are section headers, `#|` lines are rows.
# There is no second cheatsheet file to drift — each row sits next to the
# map it documents; rows marked (kitty default) document stock bindings.
# ──────────────────────────────────────────────────────────────────────────
# NO shift+enter MAPPING HERE — deliberately. Ghostty's config carries
# `keybind = shift+enter=text:\n`, and porting it was the obvious move. It is
# wrong for kitty. kitty implements the enhanced keyboard protocol, so an app
# that negotiates it receives Shift+Enter as CSI 13;2u and can tell it apart
# from Enter on its own. Claude Code's own bundle says so outright:
#   "Note: iTerm2, WezTerm, Ghostty, Kitty, Warp, and Windows Terminal
#    support Shift+Enter natively."
# A send_text map would OVERRIDE that and hand the app a bare \n (0x0A,
# Ctrl+J), which many TUIs read as submit — breaking the multi-line input the
# Ghostty keybind existed to provide.
#
# If Shift+Enter ever does submit instead of inserting a newline, the fix is
# NOT \n. Claude Code's convention is ESC+Enter:
#   map shift+enter send_text all \x1b\r

# Opt+Backspace → delete word backward. zsh reads ESC+DEL as
# backward-delete-word. macOS standard, unbound in kitty by default.
# This fires regardless of macos_option_as_alt: kitty always treats Option as
# Alt for its OWN shortcuts, and those take priority (see man 5 kitty.conf).
map alt+backspace send_text all \x1b\x7f

# Left Option is Alt/Meta (zsh word-jumps: alt+f, alt+b, alt+d work); right
# Option keeps composing special characters (é, ñ, °). Best of both.
macos_option_as_alt left

#|= TABS
#|~ One tab per thing you are working on. Shell integration names each tab
#|~ after its directory, so the bar reads like a list of projects.
#|  cmd+t              new tab, same directory
#|> Opens where you already are, not in ~. That is `new_tab_with_cwd`;
#|> kitty's own cmd+t would drop you in your home directory.
#|  cmd+w              close pane — the last pane closes its tab
#|  cmd+shift+w        close whole tab
#|  cmd+1 … cmd+9      jump to tab 1–9
#|  cmd+shift+l        back to the previously active tab
#|> A toggle, not a cycle: press it twice and you are back. This is the
#|> fast way to bounce between two projects.
#|  cmd+shift+] / [    next / previous tab      (kitty default)
#|  cmd+shift+. / ,    move tab right / left
#|  cmd+shift+i        rename tab               (kitty default)
#|
# cmd+N is tab N — the mac convention (Safari, Terminal, iTerm). kitty's
# default nth_window jumps are given up for it; panes keep cmd+[ / cmd+]
# and cmd+alt+arrows below.
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
# New tab lands in the current project, not in ~ (the default new_tab).
map cmd+t new_tab_with_cwd
# cmd+w closes ONE PANE, not kitty's default whole-tab — close_tab is
# lethal with a Claude session and an editor split side by side. The last
# pane closing closes the tab; cmd+shift+w takes the whole tab outright
# (its default, close OS window, is what cmd+q is for).
map cmd+w       close_window
map cmd+shift+w close_tab
# Bounce between the two tabs actually in use.
map cmd+shift+l goto_tab -1
# Reorder tabs; switching stays on the defaults cmd+shift+] / cmd+shift+[.
map cmd+shift+. move_tab_forward
map cmd+shift+, move_tab_backward

#|= PANES
#|~ Splitting one tab. The usual shape here is Claude Code in the big pane
#|~ with an editor or a log tailing beside it.
#|  cmd+d              split right, same directory
#|  cmd+shift+d        split below, same directory
#|  cmd+alt+arrows     focus pane by direction
#|  cmd+] / cmd+[      next / previous pane
#|  cmd+alt+d          split right, 2/3 : 1/3 — keeps Claude Code wide
#|> Use this instead of cmd+d when Claude is in the pane. Claude Code
#|> TRUNCATES rows rather than wrapping them, so an even split of a 165
#|> column window leaves 81 a side and starts cutting output. Biased, the
#|> same window gives 108 and 54.
#|  cmd+alt+shift+d    split below, 2/3 : 1/3
#|  cmd+shift+enter    zoom pane to the full window — again to unzoom
#|> Nothing is closed or moved: it flips the tab to the stack layout and
#|> back, so every pane keeps running.
#|  cmd+r              resize mode: arrows grow/shrink, esc done   (kitty default)
#|  cmd+shift+r        equalize all pane sizes
#|  cmd+shift+j        jump to a pane by label — direct when only two are open
#|> With three or more panes it paints a letter on each and waits for one
#|> keypress. With exactly two it just switches, so it is a plain toggle.
#|  cmd+shift+s        swap this pane with one you pick
#|  cmd+alt+b          widen this pane to 67% — cmd+shift+r resets
#|> For after the split already exists. Sets the bias of the split holding
#|> the focused pane; pressing it again keeps 67%, it does not toggle.
#|  cmd+alt+enter      rotate the split's axis
#|  cmd+enter          new pane, kitty picks the spot   (kitty default)
#|
# Splits: Claude Code in one pane, editor/logs beside it. cwd=current so a
# new split lands in the project, not in ~.
map cmd+d       launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
# A 50/50 vsplit of a 211-column window leaves 104 columns a side, and Claude
# Code TRUNCATES rows rather than wrapping them (its rows render as
# <Text wrap="truncate">, checked in the 2.1.226 binary), so the agent panel
# starts eating agent names and labels well before the pane looks cramped.
# These give the ORIGINAL pane the majority and the new one a third — enough
# for a log tail, an editor or a REPL, without starving the session.
# MEASURED, same window: plain vsplit 165 -> 81 + 81; biased 165 -> 108 + 54.
map cmd+alt+d       launch --location=vsplit --cwd=current --bias=33
map cmd+alt+shift+d launch --location=hsplit --cwd=current --bias=33
map cmd+alt+left  neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up    neighboring_window up
map cmd+alt+down  neighboring_window down
map cmd+] next_window
map cmd+[ previous_window
# Zoom = flip to the stack layout and back. This is cmd+SHIFT+enter; plain
# shift+enter stays native for Claude Code (see the note above).
map cmd+shift+enter toggle_layout stack
# cmd+r (default) resizes interactively; this undoes the damage.
map cmd+shift+r reset_window_sizes

# Pick a pane by label rather than walking to it. Worth a key at 2-4 panes for
# a reason the man page states outright: with only TWO windows open it skips
# the overlay and switches directly, so it is a zero-thought toggle there, and
# still one keypress at three or four — where cmd+alt+arrow stops being obvious
# because "which direction is the logs pane" depends on the geometry.
map cmd+shift+j focus_visible_window
# The same picker, but it swaps the two panes. The alternative is closing and
# recreating one, which is what confirm_os_window_close exists to prevent.
map cmd+shift+s swap_with_window

# --bias=33 above is a CREATION-time decision that could not be revisited;
# cmd+r interactive resize was the only after-the-fact control. This sets the
# bias of the split holding the focused window, so the Claude pane can be
# widened from inside itself. cmd+shift+r above is the way back to equal.
#
# ONE VALUE, NOT A LIST. This was first written `bias 67 50 80` on the
# documented behaviour that a list "rotates through as you press the key" —
# and it was INERT. Measured against a staged kitty: four presses of the list
# form moved nothing, while `bias 67` took the focused pane from 50 to 115
# columns of 170. That doc paragraph belongs to the TALL layout; this config
# runs `splits`, where bias takes a single percentage and is idempotent
# (repeated presses stay at 67, they do not toggle back to 50).
# 33 is the same knob the other way if a narrow pane is ever wanted.
map cmd+alt+b layout_action bias 67
# Flip a split between vertical and horizontal without rebuilding it.
map cmd+alt+enter layout_action rotate

#|= SCROLLBACK & PROMPTS
#|~ Reading what already happened. Shell integration marks every prompt,
#|~ which is what lets these jump by COMMAND instead of by line.
#|  cmd+up / cmd+down  jump to previous / next shell prompt
#|> Walks command to command. Three presses of cmd+up puts you at the
#|> build you ran three commands ago.
#|  cmd+f              search scrollback        (kitty default)
#|  cmd+shift+h        scrollback in the pager
#|  cmd+shift+g        last command's output in the pager
#|> Only ever the LAST command. For an older one use cmd+alt+g below.
#|  cmd+k              clear screen, scrollback kept    (kitty default)
#|  alt+cmd+k          wipe scrollback too      (kitty default)
#|  cmd+shift+up/down  jump to the next ERROR / WARN / FAIL mark
#|> Does nothing until cmd+shift+m is on — it moves between the lines that
#|> binding highlights, which is the half that was missing.
#|  cmd+shift+k        push this prompt to the top — nothing lost
#|> Like cmd+k for tidiness, but the lines it pushes up stay reachable and
#|> are not added to the scrollback either.
#|  cmd+alt+g          pager for the command cmd+up last jumped to
#|> The pair to cmd+up. Walk back to the build that failed, then open
#|> THAT command's output on its own, with search.
#|  cmd+home / end     top / bottom of the buffer   (kitty default)
#|  cmd+page up/down   page through it              (kitty default)
#|
# Scrollback and last-command pagers on cmd, matching macOS muscle memory.
# (The kitty_mod defaults ctrl+shift+h / ctrl+shift+g still work too.)
# cmd+shift+g is the Claude Code workhorse: with shell integration marking
# prompts, it opens JUST the last command's output in the pager.
map cmd+shift+h show_scrollback
map cmd+shift+g show_last_command_output
# Prompt-to-prompt jumps (shell integration marks every prompt). Replaces
# the default scroll-one-line, which cmd+page-up/down still covers.
map cmd+up   scroll_to_prompt -1
map cmd+down scroll_to_prompt 1

# THE OTHER HALF OF cmd+shift+m. That binding paints every error/warn/fail in
# the scrollback and then gave no way to REACH one — you still scrolled looking
# for colour. These jump mark to mark, shaped as a deliberate pair with
# cmd+up/cmd+down above: prompts on plain cmd, marks on cmd+shift.
#
# Inert while the marker is off, which this file's own policy calls out as a
# defect shape. It is not a standalone feature; it is the missing half of one.
map cmd+shift+up   scroll_to_mark prev
map cmd+shift+down scroll_to_mark next

# cmd+k's non-destructive cousin: the same reflex (clear the clutter) but the
# pushed-up lines stay reachable. The `y` argument is load-bearing — bare
# scroll_prompt_to_top pushes them INTO the scrollback and `y` does not, which
# matters when the clutter is 400 lines of Claude output you may want back.
map cmd+shift+k scroll_prompt_to_top y

# cmd+shift+g can only ever give the LAST command. This gives the one you just
# walked back to: @last_visited_cmd_output is defined as the output of the
# command scroll_to_prompt jumped to. Walk back three builds with cmd+up, then
# open that build's output alone, with search.
map cmd+alt+g launch --stdin-source=@last_visited_cmd_output --stdin-add-formatting --type=overlay /usr/bin/less --chop-long-lines --RAW-CONTROL-CHARS +G

#|= KITTY ITSELF
#|~ The terminal's own controls. cmd+shift+p reaches EVERY kitty action, not
#|~ just the ones bound here — start there when a key is missing.
#|  cmd+shift+p        command palette — every kitty action, fuzzy searchable
#|> Fuzzy searchable. Anything kitty can do is in here, including the actions
#|> deliberately left unbound, like detaching a pane into another tab.
#|  cmd+/              this cheatsheet
#|> Rendered live from kitty.conf itself, so it can never drift from the
#|> bindings: every row you are reading sits beside the map that creates it.
#|  cmd+plus/minus/0   font size bigger / smaller / reset   (kitty default)
#|  ctrl+cmd+f         fullscreen               (kitty default)
#|  ctrl+cmd+,         reload config · cmd+, edit config    (kitty default)
#|  ctrl+shift+e       open a URL from the screen by keyboard   (kitty default)
#|
#|  Left alone on purpose: every plain ctrl/alt chord — ctrl+r atuin,
#|  ctrl+t and alt+c fzf, ctrl+l clear, ctrl+c, ctrl+d — and shift+enter,
#|  which Claude Code reads natively for multi-line input.
map cmd+shift+p command_palette
map cmd+/ launch --type=overlay --title "keys (q closes)" /Users/ayush/.config/kitty/kitty-keys

#|= MONITORING
#|~ What the machine and the agents are doing. Both open in their OWN tab, so
#|~ neither ever covers the pane Claude is running in; press again to focus
#|~ the tab you already have, and q to close it.
#|  cmd+shift+a        activity: machine + Claude, one screen
#|> CPU with per-core bars, GPU, memory split by kind, what is eating both,
#|> tokens per minute, plan limits, running agents and live sessions.
#|> Refreshes at 100 ms; the header prints its own cost so you can see it is
#|> cheap. Nothing runs while it is closed.
#|  cmd+shift+u        btop — deep process work
#|> For sorting, filtering and killing processes, which the activity screen
#|> does not do. Themed to the same palette. It cannot see Claude sessions,
#|> agents, tokens, or the GPU on macOS — that is what cmd+shift+a is for.
#|
# Activity dashboard: CPU/memory/battery/network, the live Claude Code sessions
# with their cwd and RSS, the running subagents with model and token counts, and
# the plan gauges. It costs nothing until opened. See the file header of
# kiln-top for why each number is sampled the way it is.
#
# IT GETS ITS OWN TAB, NOT AN OVERLAY, and that was measured rather than
# assumed. The first version used --type=overlay like the cheatsheet above.
# Driven against a staged kitty running a full-screen TUI, the overlay covered
# the pane COMPLETELY: the TUI kept running underneath and its redraw counter
# kept advancing, but it was invisible and untypeable until the overlay closed.
# Doing that to a live Claude Code pane is exactly backwards for a tool whose
# job is watching Claude work. In a tab, the same test left all three panes
# intact and the TUI redrew cleanly on return (counter 37 -> 208, unbroken).
#
# --type=background so the launcher itself has no window: it asks kitty for a
# tab only if one is not already open, and otherwise focuses the existing one,
# so holding the key down cannot pile up tabs. --allow-remote-control is the
# same pattern cmd+shift+b already uses for the broadcast kitten.
#
# cmd+shift+a was checked against a stock keymap before being taken: loading
# /dev/null as a config gives kitty's default 122 bindings, and `a` appears
# there only under ctrl+shift (0x5), never cmd+shift (0x9).
map cmd+shift+a launch --type=background --allow-remote-control /Users/ayush/.config/kitty/kiln-top-open

# btop for deep process work — sorting, filtering, killing, per-core detail.
# It is themed to this palette in ~/.config/btop/themes/kiln.theme and cannot
# show Claude sessions, agents, tokens, or GPU on macOS; kiln-top covers those.
# Same launcher, so it gets its own tab and pressing again focuses it.
map cmd+shift+u launch --type=background --allow-remote-control /Users/ayush/.config/kitty/kiln-top-open btop

# Closing an OS window that holds several panes is how a Claude session dies by
# accident. Anything with 2+ panes now asks first; a single-pane window still
# closes instantly, so the guard is never in the way.
confirm_os_window_close -1 count-background

# A short trail behind the cursor when it jumps. This is the one animation in
# this config that costs nothing at idle BY CONSTRUCTION — it only has frames
# to draw while the cursor is actually moving, and there is no timer. It makes
# the cursor findable in a 200-column window, which is the actual reason it is
# here.
cursor_trail 30
cursor_trail_decay 0.08 0.35

# The cmd+? wall toggle was REMOVED 2026-08-08 with the background cheatsheet
# it controlled. An inert keybinding is exactly the silent no-op this config
# keeps getting bitten by, so it goes with the feature.
#
# Worth keeping if a key ever needs a shifted character: spell it `cmd+?`, NOT
# `cmd+shift+/`. kitty matches the character the combination produces, and both
# shift spellings parse without warning and then never fire — verified by
# diffing the keymap against a stock baseline (they left the count at kitty's
# default 122; `cmd+?` added one).

#|= GRABBING WHAT'S ON SCREEN
#|~ Getting text off the screen without a mouse. Each of these labels every
#|~ match on screen and waits for ONE keypress to pick it.
#|  cmd+shift+f        pick a file path off the screen → type it at the cursor
#|> Claude prints paths constantly. This types the one you pick straight
#|> into the prompt, so you never retype src/foo/bar.ts.
#|  cmd+shift+n        pick a file:line → open it in $EDITOR at that line
#|  cmd+shift+y        pick a hyperlink off the screen and open it
#|  cmd+shift+x        pick a git hash / long token and copy it
#|  cmd+shift+o        copy the LAST command's whole output to the clipboard
#|> No selecting, no pager. Reach for it when a build fails and Claude
#|> wants the log.
#|  cmd+shift+m        highlight ERROR / WARN / FAIL in the scrollback — again to clear
#|> Live regex colouring in three groups. Turn it on, then use
#|> cmd+shift+up/down to move between the hits.
#|  cmd+shift+b        broadcast typing to every pane — esc ends it
#|  cmd+alt+f          pick SEVERAL paths at once, esc to finish
#|> Same idea, but keep tapping labels and press esc; all of them arrive
#|> together. Three files in one pass instead of three round trips.
#|  cmd+shift+e        pick a whole line off the screen
#|  cmd+click          select a command's output · cmd+shift+click pages it
#|> Click anywhere in an old command's output to take the whole block.
#|> Needs a shell prompt, so it does nothing inside a full-screen TUI.
#|
#|  These beat selecting with the mouse: Claude Code prints paths and
#|  src/foo.ts:42 constantly, and the hints kitten turns every one of them
#|  into a keystroke.
#
# The hints kitten labels every match on screen and waits for one keypress.
# `--program -` means "send the result to the running program as if typed",
# which is what makes cmd+shift+f useful mid-prompt to Claude.
map cmd+shift+f kitten hints --type path --program -
# linenum sends file AND line to the editor. The default program is $EDITOR;
# kitty substitutes {path} and {line} itself.
map cmd+shift+n kitten hints --type linenum
map cmd+shift+y kitten hints --type hyperlink
# `hash` matches git SHAs and any other long hex/word token; @ copies rather
# than typing, because a SHA is nearly always going somewhere else.
map cmd+shift+x kitten hints --type hash --program @

# Multi-select. cmd+shift+f is one path per invocation, so three files meant
# three round trips; this labels them all, you tap three labels and press esc,
# and all three land at the cursor together.
map cmd+alt+f kitten hints --type path --multiple --program -
# A whole line, for handing over one stack frame or log line without a mouse.
map cmd+shift+e kitten hints --type line --program -

# Reach an OLD command's output with the mouse. kitty already ships
# `mouse_map ctrl+shift+right press ungrabbed mouse_show_command_output`, but
# ungrabbed ONLY — so it is dead in any pane where the running program has
# asked for mouse events. Adding `grabbed` is most of the value here.
#
# Both need OSC 133 prompt marks, so inside a full-screen TUI with no shell
# prompt they do nothing. Real shell panes only.
mouse_map cmd+left       press ungrabbed,grabbed mouse_select_command_output
mouse_map cmd+shift+left press ungrabbed,grabbed mouse_show_command_output

# @last_cmd_output needs shell integration (enabled below) to know where the
# last command began. Straight to the clipboard: no pager, no extra window.
# This is the one to reach for after a build fails and Claude wants the log.
map cmd+shift+o launch --stdin-source=@last_cmd_output --type=background /usr/bin/pbcopy

# Live regex highlighting over the scrollback. Three groups, matched
# case-insensitively; press again to clear. Per kitty's docs this matches
# LINE BY LINE only — no multi-line patterns — and only on lines that change.
map cmd+shift+m toggle_marker iregex 1 \berror\b 2 \bwarn(ing)?\b 3 \bfail(ed|ure)?\b
# Mark colours live in the THEME file (themes/kiln.conf), with the rest of the
# palette. An older comment here claimed they had to sit in this file because
# `kitten @ set-colors` "reads colour keys only, and these are not in that set".
# That was wrong: `kitten @ get-colors` on the live socket returns all six
# mark keys, so the switcher applies them live like any other colour. Measured
# 2026-08-22. A theme that omits them falls back to kitty stock on the next
# reload — themes/README.md says so.

# Type once into every pane in the tab. Needs --allow-remote-control on the
# launch itself; the socket-only setting below does not cover a kitten that
# drives other windows.
map cmd+shift+b launch --allow-remote-control kitty +kitten broadcast --match-tab state:focused

# ──────────────────────────────────────────────────────────────────────────
# Shell integration — OSC 133 prompt marks, cursor shape, cwd reporting.
# Enables prompt jumping and keeps the working directory across new tabs.
# ──────────────────────────────────────────────────────────────────────────
shell_integration enabled

# ──────────────────────────────────────────────────────────────────────────
# Scrollback — sized for Claude Code sessions, which print a lot.
# ──────────────────────────────────────────────────────────────────────────
# 20k lines of live scrollback (~tens of MB per window on an M1 Pro — cheap).
# The pager history is the real archive: 64 MB of plain text, only allocated
# as used, reachable with cmd+shift+h long after the live buffer rolled over.
scrollback_lines 20000
scrollback_pager_history_size 64

# less, not bat, on purpose: the scrollback arrives as an ANSI screen dump,
# not a file — bat's syntax highlighting has nothing to bite on, and kitty
# substitutes INPUT_LINE_NUMBER so less opens at the position you were
# looking at. bat would lose that positioning and add nothing.
scrollback_pager /usr/bin/less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# When the window grows, refill the new rows from scrollback instead of
# leaving blank space.
scrollback_fill_enlarged_window yes

# ──────────────────────────────────────────────────────────────────────────
# Mouse & selection
# ──────────────────────────────────────────────────────────────────────────
copy_on_select clipboard

# Strip trailing whitespace from copies except in rectangle select — TUI
# output (and Claude Code's panes) pad lines to full width.
strip_trailing_spaces smart

# kitty's default set plus `:` and `$`: double-click now grabs
# `src/foo.ts:123` (the error locations Claude prints constantly) and
# `$VARIABLES` whole. Cost: double-clicking `key: value` grabs both halves —
# worth it here.
select_by_word_characters @-./_~?&=%+#$:

# ──────────────────────────────────────────────────────────────────────────
# URLs — Claude prints a lot of links.
# ──────────────────────────────────────────────────────────────────────────
# detect_urls is on by default; plain click opens, or ctrl+shift+e to pick a
# URL by keyboard (hints kitten). Colour comes from the theme's url_color.
url_style curly

# OSC-8 hyperlinks can point anywhere while displaying anything — show the
# real target on hover before opening.
show_hyperlink_targets yes

# ──────────────────────────────────────────────────────────────────────────
# Window
# ──────────────────────────────────────────────────────────────────────────
window_padding_width 12

# Opaque background, deliberately. The theme's contrast ratios are measured
# against the real background colour; opacity would blend the desktop
# through and quietly invalidate every number. If you ever want glass:
# background_opacity 0.94 + background_blur 24 — and re-judge legibility.
background_opacity 1.0

# ──────────────────────────────────────────────────────────────────────────
# Background image — decorative ONLY. Read this before changing it.
# ──────────────────────────────────────────────────────────────────────────
# A cheatsheet lived here as background_image through three designs, and all
# three failed for a reason that generalises:
#   1. Text behind text always loses. Wall rows and chat rows shared a pitch,
#      so they interleaved and the eye could not separate the layers. Shapes
#      survive being overdrawn; WORDS never do, at any tint.
#   2. A watcher that hid the wall while commands ran meant hidden forever
#      for someone who lives inside Claude Code (claude never exits).
# The reference belongs on a KEY: cmd+/ opens the overlay cheatsheet.
#
# ONE MEASUREMENT THAT LOOKS ALARMING AND IS NOT, and it applies to whatever
# hangs here: color8 sits below APCA Lc 60 over ~80% of any canvas. That is
# unreachable by construction, not a regression — the Lc 60 ceiling for the dim
# tone corresponds to an apca-Y of 0.0082 and the BARE ground #17120f is already
# 0.0068, so any paint at all breaches it. It is a property of the palette,
# which is why the claim set here is WCAG for color8, APCA only for the
# foreground.
#
# THE REJECTS ARE KEPT AS SVG ONLY (2026-08-10). coffee-poppies, aperiodic and
# the three kiln studies live in backgrounds/ as source; their 3024x1964 PNGs
# were 25 MB of dead weight in a config repo and were deleted. Any of them comes
# back with one command:
#   rsvg-convert -w 3024 -h 1964 -o backgrounds/NAME.png backgrounds/NAME.svg
#
# What lives here now:
#
# OXFORD, OHIO. Contours of the ground the last four years happened on: real
# 3DEP elevation for the 30 x 19 km around Miami University, marching-squares
# contoured at a 5 m interval, every fifth line an index contour, drawn as
# hairlines and faded out toward the upper left so the terrain lives where the
# text does not. The branching structure through the middle is the Four Mile
# Creek valley system. Nothing on this canvas is invented.
#
# It replaced two GENERATED textures, and that category change is the point.
# Poppies were "boring, not my type"; a Penrose tiling was "i still don't like
# the back ground at all". Counting the three unused kiln studies still sitting
# in this directory and the three cheatsheet walls before them, roughly eight
# palette-matched generated patterns have now been passed on. A ninth was never
# going to land. This is a found artifact instead — a document about a place.
#
# MEASURED, and all three backgrounds re-swept against the CURRENT dim tone so
# the comparison is like for like (2026-08-10):
#
#              fg worst   fg below 4.5   dim tone below 4.5
#   poppies      4.81:1       0.000%           2.661%
#   penrose      6.40:1       0.000%          11.020%
#   THIS         5.91:1       0.000%           2.050%
#
# Best of the three on the dim tone, second on the foreground, and the only one
# of them that is a picture of something.
#
# A FIRST PASS WAS TOO FAINT and had to be walked back — worth recording,
# because the instinct to keep darkening is what produced it. At a 0.10 ramp
# floor it measured a superb 8.00:1 and was, on screen, invisible: the terrain
# only showed in regions that text already covered. Something invisible is just
# a quieter kind of boring. The gate is 4.5:1, so the headroom above it is
# there to be spent, not hoarded.
#
# CHANGING THIS PATH NEEDS MORE THAN A CONFIG RELOAD. An older comment in this
# file claimed "kitty re-reads the file on config reload"; measured 2026-08-10,
# it does not when the path itself changes — after `kitten @ load-config` the
# window sampled 97-99% flat ground where terrain should have been. The image
# only appeared after:
#   kitten @ set-background-image --all <path>
# A full kitty restart also works. Worth knowing before concluding a new
# background is too faint: the first version of this one was judged invisible
# on a window that was not drawing it at all.
#
# Regenerate (re-fetches elevation tiles, ~40 requests, cached locally):
#   python3 backgrounds/oxford-topo-gen.py
background_image /Users/ayush/.config/kitty/backgrounds/oxford-topo.png
background_image_layout scaled

# LINEAR SAMPLING. Default is `no`, which makes kitty sample the background
# texture with GL_NEAREST and no mipmaps (kitty/state.c, shaders.c) — so any
# artwork that is not displayed at exactly its own pixel size aliases, and
# hairlines crawl as the window resizes. This config has been scaling a
# 3024x1964 image to a differently-sized window the whole time, with hairline
# art both times. It is not the reason either design was rejected, but it made
# both of them worse than the file on disk, and it is free to fix.
background_image_linear yes

# Titlebar takes the theme background — one seamless surface, no white strip.
macos_titlebar_color background

# Focus is signalled by the border colour (theme: ember vs quiet clay), not
# by dimming unfocused text — dimming would undo the measured contrast.
window_border_width 1pt

# splits first (default for new windows), stack for zooming one pane.
enabled_layouts splits,stack

# ──────────────────────────────────────────────────────────────────────────
# Tab bar — separator tabs. JUST TABS: the cat moved to the statusline.
# ──────────────────────────────────────────────────────────────────────────
# BOTTOM edge, 2026-08-08: the bar sits directly under Claude Code's
# statusline, beside the text entry.
#
# THE CAT IS NO LONGER HERE — 2026-08-09. The claim this whole arrangement
# rested on, that "the statusline CANNOT animate, its renders are
# event-driven", is FALSE. Claude Code's `statusLine.refreshInterval`
# (integer seconds, in settings.json) re-runs the statusline command on a real
# timer. Measured that day: two idle Claude sessions rendered EXACTLY 20 times
# in 20 s at refreshInterval=1, evenly spaced, with nobody typing. The tab bar
# was never the only kitty surface with a repeating timer — it was just the
# only one that had been tested.
#
# So the cat moved to ~/.claude/statusline.sh, which can give it four rows and
# a stage as wide as the pane instead of the single row available here.
# tab_bar.py stays loaded for the part that has no substitute: the ember
# progress bar for tabs reporting OSC 9;4. `CAT = True` at the top of that
# file brings the tab-bar cat back (set STAGE_ROWS = 0 in statusline.sh too,
# or there will be two of them).
#
# The bar is exactly ONE row (DrawData has no line-count field, no tab_bar_*
# option sets rows), and the earlier sextant sprite verdict stands — a
# three-subcell body reads as a grey lump. tab_bar.py now draws the cat from
# ordinary characters (=o.o=~ style). Every glyph pair in its art was shaped
# with hb-shape against the live Nerd Font file, because JetBrains Mono
# ligates `^=` (killing the classic =^.^= face), `!=`, `~-` and `__` — see
# that file's header before adding art.
#
# Cost: when the window is unviewable kitty stops calling the draw
# function entirely (measured: zero draw passes over 25 min backgrounded)
# and tab_bar.py stands its timer down to match. Visible-window cost is
# NOT yet measured for this sprite set — the sextant predecessor on the
# same timer machinery measured 0.50% of one core; measurement command in
# tab_bar.py's header. ANIMATE = False there is the one-line kill switch:
# static cat, zero timers.
tab_bar_edge bottom
tab_bar_style separator
tab_bar_min_tabs 1
tab_bar_margin_width 4.0
# Shell integration titles a tab with its cwd (or the running command).
# Render only the basename when the title is a path — "3 kitty ×2", not
# "3 /Users/ayush/.config/kit…". ×N = the tab holds N split panes. Bell
# "! " and activity "· " markers are prepended automatically because the
# template does not place them itself. No nested {…} in a field: kitty's
# bell-marker check parses the template with string.Formatter, which
# rejects nested braces (an f-string here breaks every bell redraw).
tab_title_template "{index} {(title.rsplit('/', 1)[-1] or '/') if title.startswith(('/', '~')) else title}{(' ×' + str(num_windows)) if num_windows > 1 else ''}"
# 20, lowered from 32 on 2026-08-08 because one long tab name was eating the
# others. kitty divides the bar's width between tabs; a tab allowed 32 cells
# takes 32 whenever its title is that long, and every other tab is squeezed
# into what is left — so opening a tab in a deeply-named project visibly cut
# the neighbours' names.
#
# The arithmetic, with tab_separator " │ " costing 3 cells per tab:
#   width needed = tabs x (max_length + 3)
#   at 32:  4 tabs = 140 cells  -> already overflows a 120-column window
#   at 20:  4 tabs =  92,  5 = 115,  6 = 138
# So 20 keeps 4-5 tabs fully legible at 120 columns and degrades gracefully
# past that. Raise it if you run wide windows with few tabs; lower it if you
# habitually keep 6+ open. Zero means no limit, which is what caused this.
tab_title_max_length 20
tab_separator " │ "
active_tab_font_style   bold
inactive_tab_font_style normal

# ASCII markers, no emoji: "! " on a tab that rang the bell, "· " on a tab
# with unseen output — both render in JetBrains Mono, no fallback roulette.
bell_on_tab "! "
tab_activity_symbol "· "

# ──────────────────────────────────────────────────────────────────────────
# Bell & notifications — silent, visible, useful.
# ──────────────────────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0
# Bounce the Dock icon when an unfocused window rings — that is how a
# finished Claude task in another tab gets attention (plus the cat: =O.O=).
window_alert_on_bell yes

# macOS notification when a command that ran >15s finishes in an unfocused
# window. Needs shell integration (on, above). This is the "walk away from a
# long Claude run" feature.
notify_on_cmd_finish unfocused 15.0

# ──────────────────────────────────────────────────────────────────────────
# Remote control — socket only.
# ──────────────────────────────────────────────────────────────────────────
# Exactly one consumer: kitty-theme live-applies a palette to every window
# via `kitten @ set-colors` (windows export KITTY_LISTEN_ON, kitten finds the
# socket itself). socket-only means nothing can drive the terminal with
# escape codes over the tty — an ssh'd remote host never gets control.
# Needs a full kitty restart (not just reload) to take effect.
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# ──────────────────────────────────────────────────────────────────────────
# Performance — the knobs are DEFAULT on purpose.
# ──────────────────────────────────────────────────────────────────────────
# repaint_delay 10 / input_delay 3 / sync_to_monitor yes are kitty's
# defaults and correct for this machine; lowering repaint_delay buys nothing
# but extra repaints.
#
# THIS CONFIG HAS NO ANIMATION AND NO IDLE REPAINTS — again, as of
# 2026-08-09, because the tab bar's cat stood down (CAT = False in
# tab_bar.py). With no cat there is no timer armed at all: the ember progress
# bar redraws only when a tab actually reports progress.
#
# The animation moved to the Claude Code statusline, where it costs a 21 ms
# script run per tick at 1 Hz per open session rather than a kitty repaint.
# That is a different budget from this one and it is measured in that file's
# header, not here.
#
# Two hard-won lessons from that cat, kept because they will apply to the
# next thing anyone tries to animate here:
#
#   1. Measure with a VISIBLE window. Hidden windows skip rendering entirely,
#      so every measurement taken with --start-as=hidden read ~0.00% and meant
#      nothing.
#   2. mark_tab_bar_dirty() only sets a flag the render loop reads when it is
#      already awake. Without a paired wakeup_main_loop() nothing is drawn —
#      the original cat's idle animation never ran once, and the perf numbers
#      that used to be written here described repaints that never happened.
#
#   3. And the one that cost the most time: CHECK THAT THE TIMER YOU ARE
#      MEASURING IS ARMED. The statusline was declared un-animatable on the
#      strength of a real measurement — 28 renders, 1s to 34s apart — taken
#      while settings.json carried "refreshInterval": 0.5 against a schema of
#      at().min(1).catch(void 0). Out-of-range is silently discarded there, so
#      the interval was never set and the measurement described a feature that
#      was switched off. Set to 1 it ticks every second, and the cat walks.
#
# The rule this comment exists to enforce is still the Ghostty custom-shader
# mistake — a 120 FPS full-screen redraw, forever. Do not.

# Steady block cursor: no blink timer, no periodic repaints, calmer to look
# at during long streams. Shell integration still flips it to a beam at the
# prompt.
cursor_shape block
cursor_blink_interval 0

# ──────────────────────────────────────────────────────────────────────────
# Theme — active palette, managed by ./kitty-theme (alias kt).
# ──────────────────────────────────────────────────────────────────────────
# current-theme.conf is a copy of one of themes/*.conf; the switcher writes
# it and live-applies over the control socket. Included LAST so it wins.
include current-theme.conf
