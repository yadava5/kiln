# Kiln — kitty's own theme. Fired clay, ember amber, parchment text.
#
# Designed for kitty on 2026-08-07, NOT translated from anything in
# ~/.config/ghostty/themes. Same taste family (earthy, warm, muted but
# decisive) but its own identity: where Kanagawa Dragon is ink-black and
# grey-green, Kiln is a warm brown-black with an amber accent — the palette
# of a pottery kiln at night.
#
# Retuned 2026-08-09 for ANSI-16 SEPARATION. Claude Code's `dark-ansi` theme
# renders its whole TUI — code blocks, syntax, file paths, tool calls, diffs,
# borders, dim text — through these sixteen slots, so slots that merely
# "looked nice together" now have to be told apart at a glance. The v1
# palette sat on two flat luminance shelves (content hues all L* 64–75,
# brights all L* 77–84) inside a 17-degree hue band, which is why everything
# read as one warm wash. v2 replaces both shelves with a deliberate luminance
# staircase and pulls the warm hues off the parchment hue band. Identity is
# unchanged: same fired-clay ground, same ember accent, same parchment text.
#
# Every ratio below was MEASURED with ~/.claude/scripts/kitty-palcheck.py
# (WCAG 2.1 + APCA + CIEDE2000 + CVD sim). Re-run it after any edit:
#   python3 ~/.claude/scripts/kitty-palcheck.py ~/.config/kitty/themes/kiln.conf
# Gates: fg >= 4.5:1, color8 >= 4.5:1 and APCA |Lc| >= 60, color0 >= 1.5:1,
# every content hue >= 4.5:1, red/green dE00 >= 20 (>= 12 under CVD).
#
# This file must contain ONLY colour settings — the switcher live-applies it
# with `kitten @ set-colors`, which reads colour keys and nothing else.

# Ground dropped from #1c1613 to #17120f. Deeper is both truer to a kiln at
# night and the highest-leverage legibility move available: it buys headroom
# on every ratio at once, which is what paid for the staircase below.
background            #17120f
foreground            #f0e5d1

# Amber ember cursor — the theme's one loud element. Text under the block
# cursor inverts to the background colour so it never vanishes.
cursor                #ffb066
cursor_text_color     #17120f

# Selection: an ember-wash glaze, not a grey box. It is deliberately DARKER
# than v1's #4a3a28 and carries its visibility in chroma instead (dE00 14.4
# from the ground). v1 left terracotta text on a selected line at 2.90:1;
# darkening the wash lifts the worst content hue to 3.84:1 while fg-on-
# selection rises to 11.18:1. Red cannot reach 4.5:1 against any selection
# still visible over this ground — measured, not assumed.
selection_background  #402614
selection_foreground  none

# Links kitty detects get the palette blue, curly-underlined (url_style is
# behaviour, so it lives in kitty.conf; the colour lives here).
url_color             #7da6d9

# Split borders: quiet clay for inactive, ember for the focused pane,
# terracotta when a bell fires in an unfocused split.
active_border_color   #efa84e
inactive_border_color #534439
bell_border_color     #f37f6f

# Tab bar: strip recessed slightly darker than the terminal ground, active
# tab on raised warm clay, inactive tabs as dim-but-legible parchment.
tab_bar_background        #110d0a
active_tab_foreground     #f6edde
active_tab_background     #4b3425
inactive_tab_foreground   #bcb3ad
inactive_tab_background   #110d0a

# ── ANSI 16 ───────────────────────────────────────────────────────────────
# The six content hues are spaced on a LUMINANCE STAIRCASE, dark to light:
#   red 56  <  magenta 63  <  blue 67  <  cyan 71  <  yellow 74  <  green 77
# (CIE L*, brights repeat the same ordering ten steps up). A syntax
# highlighter can therefore separate keywords from strings from numbers by
# weight alone, before hue is even considered — which is what survives
# squinting, low brightness and colour-vision deficiency.

# black: visible against bg (1.99:1) — a black identical to the background is
# the classic terminal-theme bug (invisible `ls` output on some servers).
# dim/comment tone is ASH, not parchment: chroma dropped 13.1 -> 4.7 so it
# reads as "not content" even where luminance alone would not carry it.
color0  #534439
# #aea49c FAILED the APCA gate this file claims to hold: 53.2 against the deeper
# v2 ground, where v1 measured 60.6 on the shallower one. Dropping the ground
# from #1c1613 to #17120f raises every WCAG *ratio* but APCA is not a ratio —
# it weights the dark end differently, and a dim tone that was already near the
# floor fell through it. Lifted along the same low-chroma ash axis until it
# clears 60 with margin: APCA 61.4, WCAG 9.02, still dE00 13.4 from the
# foreground so "dim" and "content" stay unmistakable.
color8  #bcb3ad

# red: terracotta, decisive not neon. bright: flame for errors that must pop.
# red is kept darker and green lighter ON PURPOSE: under deuteranopia both
# collapse toward brown-yellow, and the luminance gap is what keeps a git
# diff readable (measured dE00 under CVD sim, not guessed). L* 56 is the
# chosen point on that trade: L* 58 would fail the deuteranopia gate.
color1  #d8624e
color9  #f37f6f

# green: glaze green with real chroma — the top of the staircase, because
# strings are high-volume and want to read as light-weight body, not accent.
color2  #a4cb6f
color10 #c1e291

# yellow: kiln amber — the accent hue. v1's amber sat at L* 71.9 against a
# dim tone at L* 73.2 (dAPCA 1.8), so type names and comments weighed the
# same. Hue pulled from 79 to 72 and chroma from 47 to 58: amber now leaves
# the parchment hue band entirely and can never be mistaken for dim text.
color3  #efa84e
color11 #fec577

# blue: cool slate — deliberately the one cool anchor so it can never be
# confused with cyan (the Kanso Ink blue/cyan collapse, dE00 7.8, is the
# named failure mode here; Kiln measures dE00 > 20). Chroma raised 21 -> 30
# so file paths hold their own against the warm ground.
color4  #7da6d9
color12 #99c2f1

# magenta: fired manganese, clearly separate from both red and blue. Sits
# one step above red so keywords outweigh errors without shouting.
color5  #c782ba
color13 #e4a1d3

# cyan: celadon glaze — green-leaning where blue is violet-leaning.
color6  #68bdab
color14 #84d9c6

# white: three real parchment tiers plus an emphasis step. v1 spaced them on
# luminance alone and ran out of room; v2 alternates CHROMA as well, which is
# what makes each step land near dE00 10 instead of 3–7:
#   color8  ash        L* 73.5  C  4.7   dE00 14.2 to color7
#   color7  clay-white L* 81.0  C 23.0   dE00  9.8 to foreground
#   fg      parchment  L* 91.3  C 11.1   dE00 10.3 to color15
#   color15 white-hot  L* 100   C  0
# color15 is pure white ON PURPOSE. v1's #f7efe0 measured dE00 2.9 from the
# foreground — below the just-noticeable threshold, i.e. the same colour in
# two slots. Luminance alone cannot separate them (there is no room above
# L* 91 in a warm hue), so the separation is bought with CHROMA: achromatic
# white against parchment measures dE00 10.3. It is also the one physically
# honest choice — the hottest point in a kiln fires white.
color7  #d7c99e
color15 #ffffff

# ── Scrollback marks (cmd+shift+m) ───────────────────────────────────────────
# Terracotta / amber / clay, held to the same contrast discipline as the
# palette above. These ARE set-colors keys: `kitten @ get-colors` returns all
# six, so a theme switch applies them live like everything else in this file.
# Measured against the live control socket 2026-08-22.
mark1_foreground #17120f
mark1_background #d8624e
mark2_foreground #17120f
mark2_background #efa84e
mark3_foreground #f0e5d1
mark3_background #7a5432

# ── Scrollbar ────────────────────────────────────────────────────────────────
# `scrollbar scrolled` is kitty's default and is already on; the handle then
# defaults to `foreground` (#f0e5d1), which makes it the loudest thing on
# screen during a 20k-line scrollback. Clay instead.
#
# RELOAD-ONLY, unlike everything else in this file: scrollbar_handle_color is
# NOT among the keys `kitten @ get-colors` reports, so `set-colors` cannot
# carry it and a live theme switch will not move it until ctrl+cmd+,.
#
# scrollbar_track_color is deliberately NOT set. scrollbar_track_opacity
# defaults to 0, so the track is invisible except at 10% on hover; giving it a
# colour would be a line that changes nothing.
scrollbar_handle_color #7a5432
